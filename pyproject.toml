[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-master"
version = "0.1.0"
description = "Two-tier hierarchical industry and document sub-tag classifier over nvidia/Nemotron-PII"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.23",
    "joblib>=1.3",
    "typer>=0.12",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tagmaster = "tagmaster.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
